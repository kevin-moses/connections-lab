<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-logo">
            <h1>Guava Clothing</h1>
        </div>
        <div class="navbar-search">
            <input type="search" placeholder="Search..." aria-label="Search">
        </div>
        <div class="navbar-menu">
            <ul>
                <li><a href="#">Shop</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </div>
    <div class="content">
        <div class="landing">
            <div class="landing-image">
                <img src="assets/landing.jpg" alt="Landing Image">
            </div>
            <div class="landing-text">
                <h1>School is back. Are you ready?</h1>
                <div class="landing-buttons">
                    <button>Find Your School</button>
                    <button>Learn More</button>
                </div>
            </div>

        </div>
        <div class="hero">
            <div class="hero-text">
                <h1>Pick your new look.</h1>
                <p>Mix and match your school's catalog.</p>
            </div>
            <div class="hero-images">
                <img class="shirt" src="assets/shirt.png" alt="Shirt">
                <img class="pants" src="assets/pants.png" alt="Pants">
                <img class="shoes" src="assets/shoes.png" alt="Shoes">
            </div>
        </div>
    </div>
    
</body>
</html>
